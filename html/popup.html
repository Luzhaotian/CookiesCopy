<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookies Copy</title>
    <link rel="stylesheet" href="../css/popup.css" />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="header-top">
          <h1 class="title">Cookies Copy</h1>
          <select class="theme-select" id="themeSelect" title="主题模式">
            <option value="auto">自动</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </div>
        <div class="header-meta">
          <span class="domain">
            <svg class="domain-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            <span id="title"></span>
          </span>
          <span class="cookie-count" id="cookieCount"></span>
        </div>
      </div>
      <div class="search-box">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="搜索名称或值..."
        />
      </div>
      <div class="actions">
        <button class="btn" id="copyAllKey">复制键名</button>
        <button class="btn btn--primary" id="copyAll">全部复制</button>
        <button class="btn" id="copyAllValue">复制值</button>
      </div>
      <div class="actions">
        <button class="btn" id="exportJson">导出 JSON</button>
      </div>
      <ul class="cookies-list" id="cookiesList"></ul>
      <div class="toast" id="toast"></div>
    </div>
    <script type="text/javascript" src="../js/popup.js"></script>
  </body>
</html>
